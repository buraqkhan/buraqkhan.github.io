{%- comment -%} Usage: {% include post-list.html items=site.posts limit=5 %} {%- endcomment -%}
{%- assign limit = include.limit | default: 1000 -%}
<ul class="entry-list">
  {%- for item in include.items limit: limit -%}
  <li>
    <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
    <time datetime="{{ item.date | date_to_xmlschema }}">{{ item.date | date: "%b %-d, %Y" }}</time>
  </li>
  {%- endfor -%}
</ul>
