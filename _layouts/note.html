---
layout: default
---
<article class="note">
  <header class="page-header">
    <p class="meta">
      <a href="{{ '/notes/' | relative_url }}">Notes</a>
      {%- if page.date %}
      <span aria-hidden="true">·</span>
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {%- endif %}
      {%- if page.topic %}
      <span aria-hidden="true">·</span>
      <span>{{ page.topic }}</span>
      {%- endif %}
    </p>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
